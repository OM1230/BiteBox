<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/5da90b84f3.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header>
      <img src="Images/BiteBox.png" alt="" height="80px" width="120px" />

      <nav style="word-spacing: 5px">
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="biteDeals.html">BiteDeals</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="login.html"
          ><i class="fa-solid fa-right-to-bracket"></i>Login</a>
      </nav>
    </header>
    <!-- Header ends here -->

    <!-- Login  -->
     <section class="auth-container">
      <div class="auth-box">
        <h2>Login</h2>
        <!-- login form -->
         <form action="" onsubmit="login(event)">
          <input type="email" placeholder="Enter Email" id="email" required>

          <div style="position: relative;">
            <input type="password" name="" id="password" placeholder="Enter password" required>
            <span onclick="showPassword()" style="position: absolute; right:0px; top:30px; color: black; transform:translateY(-50%); cursor: pointer"><i class="fa-solid fa-eye"></i></span>
          </div>

          <!-- <input type="password" placeholder="Enter Password" id="password" required> -->
          <button onclick="login()" type="submit">Login</button>
         </form>
         <p id="error" style="color: red;"></p>
         <span>Forgot Password</span>
         <p>Don't have a accout? <a href="signup.html">Signup</a></p>

      </div>
     </section>

     <script src="JavaScript/script.js"></script>
  </body>
</html>
